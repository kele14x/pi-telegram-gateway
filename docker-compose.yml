services:
  gateway:
    build: .
    image: pi-telegram-gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    # Container paths override any host paths set in .env.
    environment:
      PI_CODING_AGENT_DIR: /data/pi-agent
      PI_TELEGRAM_CWD: /workspace
      PI_TELEGRAM_SESSIONS_DIR: /data/sessions
    volumes:
      - data:/data
      - ${PI_WORKSPACE:-./workspace}:/workspace

  pi-setup:
    build: .
    image: pi-telegram-gateway
    profiles: [setup]
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      PI_CODING_AGENT_DIR: /data/pi-agent
      TERM: xterm-256color
    command: ["/app/node_modules/.bin/pi"]
    volumes:
      - data:/data

volumes:
  data:
